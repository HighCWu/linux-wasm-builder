name: Browser storage lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-storage.yml'
      - 'scripts/browser-storage/**'

permissions:
  contents: read

concurrency:
  group: browser-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - run: git submodule update --init --depth 1 sources/distro
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated browser suite without Linux or LLVM
        run: |
          suite="$RUNNER_TEMP/browser-storage"
          mkdir -p "$suite/tests"
          cp scripts/browser-storage/package.json scripts/browser-storage/index.html "$suite/"
          cp sources/distro/packages/browser-tests/server.js sources/distro/packages/browser-tests/playwright.config.js "$suite/"
          cp sources/distro/packages/browser-tests/tests/opfs-disk.spec.js "$suite/tests/"
          cp scripts/browser-storage/host-http.spec.js "$suite/tests/"
          cp scripts/browser-storage/browser-fs.spec.js "$suite/tests/"
          npm install --prefix "$suite" --no-audit --no-fund
          "$suite/node_modules/.bin/esbuild" sources/distro/apps/site/opfs-disk-worker.js \
            --bundle --format=esm \
            --alias:@lowland/kernel/virtio/block.js="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/block.ts" \
            --alias:@lowland/kernel/virtio/remote.js="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/remote.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$suite/opfs-disk-worker.js"
          "$suite/node_modules/.bin/esbuild" sources/distro/packages/linux-guest/src/host-fetch-network.ts \
            --bundle --format=esm --outfile="$suite/host-http.js"
          "$suite/node_modules/.bin/esbuild" sources/distro/packages/linux-guest/src/browser.ts \
            --bundle --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$suite/browser-fs.js"
      - name: Install browser
        run: '"$RUNNER_TEMP/browser-storage/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - name: Verify real OPFS initialization failure recovery
        run: |
          cd "$RUNNER_TEMP/browser-storage"
          PLAYWRIGHT_JSON_OUTPUT_NAME=storage-report.json \
            ./node_modules/.bin/playwright test --project=${{ matrix.browser }} --forbid-only \
              --reporter=line,json \
              --grep '(invalid disk capacity preserves OPFS data and releases its lock|flushes virtio writes through the real OPFS worker|cancels pending Fetch response reads on disconnect|releases disconnected Fetch callbacks and cancels late responses|forwards fragmented POST bodies through browser Request|enforces upload budgets only when browser buffering is required|cancels incomplete browser uploads without sending a response|aborts failed BrowserFS mutations and preserves committed OPFS bytes|BrowserFS synchronization waits for the real OPFS write commit)$'
          node "$GITHUB_WORKSPACE/scripts/browser-storage/check-report.mjs" storage-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-storage-results-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/browser-storage/test-results
            ${{ runner.temp }}/browser-storage/storage-report.json
