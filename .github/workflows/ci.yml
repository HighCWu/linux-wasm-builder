name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Initialize the distro metadata source
        run: git submodule update --init --depth 1 sources/distro sources/musl
      - name: Check Wasm raw stat layouts
        run: bash scripts/check_wasm_kstat.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check SDK compiler argument contract
        run: |
          clang --version
          node --test sources/distro/distro/sdk/wrapper-test.js \
            sources/distro/distro/sdk/config-driver-test.js
      - name: Check SDK CMake example on the build host
        run: |
          cmake -P sources/distro/distro/sdk/linux-wasm.cmake.in
          cmake -S sources/distro/distro/sdk/cmake-example \
            -B "$RUNNER_TEMP/sdk-cmake" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sdk-cmake"
          "$RUNNER_TEMP/sdk-cmake/sdk-example"
      - name: Check documentation and source pins
        run: python3 scripts/check_repository.py
      - name: Check paired benchmark summaries
        run: python3 -B scripts/test_compare_mmap_benchmarks.py
