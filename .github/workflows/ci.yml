name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      file-copy-benchmark:
        description: Run three fresh file-copy benchmark boots for both pointer widths
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep explicit benchmark dispatches separate from routine push validation;
  # GitHub replaces a pending run even when cancel-in-progress is false.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  file-copy-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.file-copy-benchmark
    uses: ./.github/workflows/file-copy-benchmark.yml
  repository:
    name: Repository metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Initialize the distro metadata source
        run: git submodule update --init --depth 1 sources/distro sources/musl
      - name: Check Wasm raw stat layouts
        run: bash scripts/check_wasm_kstat.sh
      - name: Check inotify native workload and existing Wasm libc ABI
        run: python3 -B scripts/test_inotify.py
      - name: Check existing fchmodat flags path and native descriptor permissions
        run: python3 -B scripts/test_fchmodat.py
      - name: Check named semaphore deadline admission with host shims
        # Fetch only the exact pinned function source, not a full Linux checkout.
        # This checks admission logic, not Wasm execution or scheduler behavior.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/test_fetch_pinned_semaphore_source.py
          revision=$(git ls-tree HEAD sources/linux | awk '{print $3}')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          python3 -B scripts/fetch_pinned_semaphore_source.py \
            "$revision" "$RUNNER_TEMP/wasm-semaphore.c"
          python3 -B scripts/check_named_semaphore_deadline.py "$RUNNER_TEMP/wasm-semaphore.c"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check existing file-handle wrappers and workload analysis
        run: python3 -B scripts/test_file_handle.py
      - name: Check directory notification workload and disabled-feature control
        run: python3 -B scripts/test_dnotify.py
      - name: Check existing scheduler dispatch, machine words and false-success control
        run: python3 -B scripts/test_scheduler.py
      - name: Check alternate signal-stack reference semantics and execution adapter
        run: |
          python3 -B scripts/test_signal_altstack.py
          node --test sources/distro/packages/kernel/test/signal-stack.test.ts
      - name: Check failed fork Worker lifetime with exact pinned kernel source
        # Host atomics/sanitizers and small Wasm codegen, not kernel execution.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git ls-tree HEAD sources/linux | awk '{print $3}')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/HighCWu/linux/contents/arch/wasm/kernel/process.c?ref=$revision" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/wasm-process.c"
          python3 -B scripts/check_fork_worker_abort.py "$RUNNER_TEMP/wasm-process.c"
          mkdir -p "$RUNNER_TEMP/wasm-membarrier/kernel" "$RUNNER_TEMP/wasm-membarrier/configs"
          cp "$RUNNER_TEMP/wasm-process.c" "$RUNNER_TEMP/wasm-membarrier/kernel/process.c"
          for config in defconfig wasm32_defconfig wasm64_defconfig; do
            gh api "repos/HighCWu/linux/contents/arch/wasm/configs/$config?ref=$revision" \
              --jq .content | base64 --decode > "$RUNNER_TEMP/wasm-membarrier/configs/$config"
          done
          WASM_MEMBARRIER_ARCH_SOURCE="$RUNNER_TEMP/wasm-membarrier" \
            python3 -B scripts/test_membarrier.py
          gh api "repos/HighCWu/linux/contents/arch/wasm/kernel/syscall.c?ref=$revision" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/wasm-syscall.c"
          mkdir -p "$RUNNER_TEMP/wasm-membarrier/include/uapi/asm"
          cp "$RUNNER_TEMP/wasm-syscall.c" "$RUNNER_TEMP/wasm-membarrier/kernel/syscall.c"
          for file in kernel/ptrace.c kernel/stacktrace.c include/uapi/asm/ptrace.h; do
            gh api "repos/HighCWu/linux/contents/arch/wasm/$file?ref=$revision" \
              --jq .content | base64 --decode > "$RUNNER_TEMP/wasm-membarrier/$file"
          done
          WASM_PTRACE_ARCH_SOURCE="$RUNNER_TEMP/wasm-membarrier" \
            python3 -B scripts/test_ptrace.py
          WASM_STACKTRACE_SOURCE="$RUNNER_TEMP/wasm-membarrier/kernel/stacktrace.c" \
            python3 -B scripts/test_stacktrace.py
          node --test sources/distro/packages/kernel/test/stacktrace.test.ts
          WASM_MREMAP_SYSCALL_SOURCE="$RUNNER_TEMP/wasm-syscall.c" \
            node --test scripts/test_mremap_syscall.js
          node --test scripts/test_mremap_allocator.js
      - name: Check SDK compiler and dependency discovery contracts
        run: |
          clang --version
          node --test sources/distro/distro/sdk/wrapper-test.js \
            sources/distro/distro/sdk/license-texts-test.js \
            sources/distro/distro/sdk/config-driver-test.js \
            sources/distro/distro/sdk/exception-codegen-test.js \
            sources/distro/distro/sdk/pkg-config-test.js
      - name: Check SDK build material archive with native fixtures
        # Does not build LLVM, Linux, or a target runtime on the local host.
        run: |
          python3 -B sources/distro/distro/sdk/build-materials-test.py
          python3 -B sources/distro/distro/sdk/checkout-bundle-test.py
          python3 -B sources/distro/distro/sdk/source-artifact-test.py
      - name: Check kernel and BusyBox source material packaging
        run: |
          node --test sources/distro/distro/linux/build-materials-test.js \
            sources/distro/distro/linux/source-bundle-test.js \
            sources/distro/distro/busybox/source-bundle.test.js
      - name: Check C++ runtime fixture with host GCC and Clang
        # Host execution catches fixture regressions; it is not Wasm ABI evidence.
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/toolchain-smoke/runtime-cxx.cc \
              -o "$RUNNER_TEMP/sdk-runtime-cxx-host"
            timeout 30s "$RUNNER_TEMP/sdk-runtime-cxx-host"
          done
      - name: Check NULL user-access syscall errors and side effects on native Linux
        # Actual Wasm import behavior is covered by the separate target check.
        run: node --test sources/distro/distro/toolchain-smoke/user-access.test.js
      - name: Check C++ filesystem consumer on the build host
        # Host libraries do not prove the Wasm libc++ filesystem implementation.
        run: node --test sources/distro/distro/sdk/filesystem-test.js
      - name: Check shared QuickJS fixture and explicit wasm64 scope
        # Syntax and wiring only; target language execution stays in public Nix CI.
        run: |
          node --test sources/distro/distro/quickjs/language-contract.test.js \
            sources/distro/distro/vm-test/license-layout-test.js
      - name: Check the fork continuation workload on native Linux
        # Native fork validates the fixture only. Wasm continuation and actual
        # target PIDs/TLS still require the separately selected heavy checks.
        run: |
          node --test sources/distro/packages/browser-tests/fork-contract.test.js
          node --test sources/distro/packages/browser-tests/process-contract.test.js
          node --test sources/distro/distro/fork-continuation/process-control.test.js
          node --test sources/distro/distro/fork-continuation/exec-fd.test.js
          node --test sources/distro/distro/fork-continuation/sdk.test.js
          node --test sources/distro/distro/fork-continuation/raw-clone.test.js
          node --test sources/distro/distro/fork-continuation/fault-contract.test.js
          node --test sources/distro/distro/fork-continuation/signal-contract.test.js
          node --test sources/distro/distro/fork-continuation/benchmark.test.js
          node --test sources/distro/distro/fork-continuation/latency.test.js
          node --test sources/distro/distro/fork-continuation/latency-browser.test.js
          node --experimental-vm-modules --test sources/distro/distro/fork-continuation/worker-bundle.test.js
          patch --dry-run -p1 -d sources/musl \
            < sources/distro/distro/musl/fork-continuation.patch
          for compiler in gcc clang; do
            "$compiler" -O2 -Wall -Wextra -Werror \
              sources/distro/distro/fork-continuation/exec-child.c \
              -o "$RUNNER_TEMP/fork-exec-host"
            "$compiler" -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/fork-continuation/runtime.c \
              -o "$RUNNER_TEMP/fork-continuation-host"
            timeout 20s "$RUNNER_TEMP/fork-continuation-host" "$RUNNER_TEMP/fork-exec-host"
          done
      - name: Check socket runtime fixture on the build host
        # Only the Wasm init configures its own loopback interface.
        run: |
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O2 -Wall -Wextra -Werror \
              sources/distro/distro/sdk/socket-example.c \
              -o "$RUNNER_TEMP/sdk-socket-host"
            timeout 30s "$RUNNER_TEMP/sdk-socket-host"
          done
      - name: Check timer and pthread time64 fixtures on the build host
        # Shared raw-initramfs fixtures stay alive after their final marker.
        run: node --test sources/distro/distro/sdk/time-consumer-test.js
      - name: Reject narrow and missing raw futex syscall arguments
        run: node --test sources/distro/distro/sdk/futex-abi-test.js
      - name: Check semaphore deadline fixture on the build host
        # glibc does not exercise musl's invalid-unused-nanoseconds fast path.
        run: node --test sources/distro/distro/sdk/semaphore-deadline-test.js
      - name: Check SQLite runtime fixture on the build host
        # Fixture validation only; actual target builds use pinned SQLite 3.51.0.
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev sqlite3 zstd lua5.4 liblua5.4-dev libssl-dev curl libcurl4-openssl-dev busybox lld
          node --test sources/distro/packages/browser-tests/site-sqlite.test.js sources/distro/packages/browser-tests/site-fs-trace.test.js sources/distro/packages/linux-guest/tests/agent-wasm64-sqlite-commands.test.ts
          node --test sources/distro/distro/sqlite3/pkg-config-test.js
          for compiler in gcc clang; do
            "$compiler" -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/sdk/sqlite-example.c -lsqlite3 \
              -o "$RUNNER_TEMP/sdk-sqlite-host"
            timeout 30s "$RUNNER_TEMP/sdk-sqlite-host"
          done
      - name: Check IPv6 native workload and existing Wasm libc ABI
        # The preceding host fixture step installs the reference BusyBox.
        run: python3 -B scripts/test_ipv6.py
      - name: Check split syscall words and sparse large-file workload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git ls-tree HEAD sources/linux | awk '{print $3}')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/HighCWu/linux/contents/arch/wasm/include/asm/syscall_wrapper.h?ref=$revision" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/syscall-wrapper.h"
          gh api "repos/HighCWu/linux/contents/arch/wasm/include/uapi/asm/sigcontext.h?ref=$revision" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/wasm-sigcontext.h"
          WASM_SYSCALL_WRAPPER_SOURCE="$RUNNER_TEMP/syscall-wrapper.h" \
            WASM_SIGCONTEXT_SOURCE="$RUNNER_TEMP/wasm-sigcontext.h" \
            python3 -B scripts/test_syscall_words.py
          python3 -B scripts/test_large_file.py
      - name: Check SysV IPC runtime workload and exact kernel UAPI layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git ls-tree HEAD sources/linux | awk '{print $3}')
          python3 -B scripts/fetch_kernel_ipc_uapi.py "$revision" "$RUNNER_TEMP/ipc-uapi"
          WASM_IPC_UAPI_DIR="$RUNNER_TEMP/ipc-uapi" python3 -B scripts/test_sysv_ipc.py
      - name: Check fork callback and flags-first Wasm imports link together
        # Small freestanding links, not a target libc/kernel runtime acceptance.
        run: node --test sources/distro/distro/fork-continuation/execution-link.test.js
      - name: Check standard-fork Bash candidate workload on the build host
        # Native script/recipe validation, not Wasm or SjLj/Asyncify acceptance.
        run: |
          node --test sources/distro/distro/bash-fork/processes.test.js \
            sources/distro/distro/bash-fork/sjlj.test.js \
            sources/distro/distro/fork-continuation/high32.test.js \
            sources/distro/distro/toolchain-smoke/msync.test.js \
            sources/distro/distro/toolchain-smoke/madvise.test.js \
            sources/distro/distro/toolchain-smoke/fixed-mmap.test.js
          clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text \
            sources/distro/distro/bash-fork/sjlj.c -o /dev/null
          clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text \
            sources/distro/distro/fork-continuation/exec-fd.c -o /dev/null
          clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text \
            sources/distro/distro/fork-continuation/process-control.c -o /dev/null
          clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text \
            sources/distro/distro/fork-continuation/high32.c -o /dev/null
          clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text \
            sources/distro/distro/toolchain-smoke/msync.c -o /dev/null
      - name: Check shared Lua workload on a native interpreter
        # Native execution validates the fixture, not target SjLj or the Wasm ABI.
        run: |
          node --test sources/distro/distro/lua/language-host.test.js \
            sources/distro/distro/lua/development-host.test.js \
            sources/distro/distro/lua/application-host.test.js
      - name: Check verified TLS consumer on the build host
        # Native OpenSSL is fixture evidence, not target TLS or browser networking.
        run: node --test sources/distro/distro/openssl/tests/handshake-host.test.js
      - name: Check Git width, notices and shared public-root workload
        # Host checks do not prove target execution or complete license compliance.
        run: |
          node --test sources/distro/distro/git/*-host.test.js \
            sources/distro/packages/linux-guest/tests/agent-wasm64-git-commands.test.ts
          python3 -B sources/distro/distro/git/source-bundle-test.py
          python3 -B sources/distro/distro/python/git-workspace-test.py
      - name: Check Python anonymous mapping fixture on the build host
        # Native execution checks the workload, not the target kernel boundaries.
        run: |
          node --test sources/distro/distro/python/mmap-host.test.js \
            sources/distro/distro/python/faulthandler-host.test.js \
            sources/distro/distro/python/width-host.test.js \
            sources/distro/distro/python/root-host.test.js
          python3 -B sources/distro/distro/python/source-bundle-test.py
      - name: Package the pure-Python application example
        # No interpreter, kernel or target compiler is bundled or built here.
        run: |
          bundle="$RUNNER_TEMP/python-application-example"
          mkdir -p "$bundle/source"
          cp -R sources/distro/distro/python/example "$bundle/source/example"
          cp sources/distro/distro/python/build-example.py "$bundle/source/build-example.py"
          cp sources/distro/distro/python/example/LICENSE "$bundle/LICENSE"
          python3 -B "$bundle/source/build-example.py" "$bundle/application.pyz"
          python3 -B sources/distro/distro/python/application-test.py --example "$bundle/application.pyz"
          python3 -B scripts/source_manifest.py > "$bundle/source-pins.json"
      - name: Upload the pure-Python application example
        uses: actions/upload-artifact@v7
        with:
          name: python-application-example-${{ github.sha }}
          path: ${{ runner.temp }}/python-application-example/
          if-no-files-found: error
          retention-days: 7
      - name: Package the Python Git workspace application
        # Only project-owned MIT source is bundled; no runtime binaries or dependencies.
        run: |
          python3 -B scripts/test_workspace_artifact.py
          bundle="$RUNNER_TEMP/python-git-workspace-example"
          mkdir -p "$bundle/source/example"
          cp sources/distro/distro/python/git-workspace-example.py "$bundle/source/example/__main__.py"
          cp sources/distro/distro/python/example/LICENSE "$bundle/source/example/LICENSE"
          cp sources/distro/distro/python/example/LICENSE "$bundle/LICENSE"
          cp sources/distro/distro/python/build-example.py "$bundle/source/build-example.py"
          python3 -B -c \
            'import pathlib,runpy,sys; runpy.run_path(sys.argv[1])["build"](pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3]), ("LICENSE", "__main__.py"))' \
            "$bundle/source/build-example.py" "$bundle/git-workspace.pyz" "$bundle/source/example"
          workspace=$(mktemp -d)
          report=$(python3 -I "$bundle/git-workspace.pyz" write "$workspace/workspace")
          head=$(printf '%s\n' "$report" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"])')
          python3 -I "$bundle/git-workspace.pyz" read "$workspace/workspace" "$head"
          python3 -B scripts/source_manifest.py > "$bundle/source-pins.json"
          (cd "$bundle" && sha256sum LICENSE git-workspace.pyz source-pins.json source/build-example.py source/example/LICENSE source/example/__main__.py > SHA256SUMS)
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          python3 -B scripts/verify_workspace_artifact.py "$bundle"
      - name: Upload the Python Git workspace application
        uses: actions/upload-artifact@v7
        with:
          name: python-git-workspace-example-${{ github.sha }}
          path: ${{ runner.temp }}/python-git-workspace-example/
          if-no-files-found: error
          retention-days: 7
      - name: Check curl verified HTTPS over native Linux TCP
        # Native CLI versions validate the fixture, not the Wasm build or browser transport.
        run: |
          node --test sources/distro/distro/curl/tests/https-host.test.js \
            sources/distro/distro/curl/tests/development-host.test.js
      - name: Check SDK CMake integration on the build host
        run: |
          node --test sources/distro/distro/llvm-runtimes/cxa-thread-atexit-test.js
          cmake -P sources/distro/distro/sdk/linux-wasm.cmake.in
          node --test sources/distro/distro/sdk/cmake-toolchain-test.js
          cmake -S sources/distro/distro/sdk/cmake-example \
            -B "$RUNNER_TEMP/sdk-cmake" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sdk-cmake"
          "$RUNNER_TEMP/sdk-cmake/sdk-example"
      - name: Check separately installed SDK dependency on the build host
        run: node --test sources/distro/distro/sdk/installed-consumer-test.js
      - name: Check standard Wasm exception assembly gate on the build host
        run: node --test sources/distro/distro/sdk/check-modern-eh.test.js
      - name: Check SDK Autoconf cross configuration on the build host
        run: |
          node --test sources/distro/distro/sdk/autoconf-consumer-test.js \
            sources/distro/distro/sdk/site-policy-test.js
      - name: Check SDK Meson build-machine generator on the build host
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-meson"
          "$RUNNER_TEMP/sdk-meson/bin/pip" install --disable-pip-version-check meson==1.10.0
          meson_site=$("$RUNNER_TEMP/sdk-meson/bin/python" -c 'import pathlib, mesonbuild; print(pathlib.Path(mesonbuild.__file__).parent.parent)')
          patch -d "$meson_site" -p1 < sources/distro/distro/sdk/meson-wasm-archive-groups.patch
          "$RUNNER_TEMP/sdk-meson/bin/python" sources/distro/distro/sdk/meson-archive-test.py
          SDK_TEST_MESON="$RUNNER_TEMP/sdk-meson/bin/meson" \
            node --test sources/distro/distro/sdk/meson-consumer-test.js
      - name: Check documentation and source pins
        run: |
          python3 scripts/check_repository.py
          python3 -B scripts/test_repository_source_pins.py
      - name: Check SDK spawn bounds against the native parser
        run: python3 -B scripts/test_agent_spawn_contract.py
      - name: Check musl integer macros, GNU memfd declaration and clone3 number
        run: python3 -B scripts/test_musl_integer_headers.py
      - name: Check musl msync declaration and syscall forwarding without building libc
        run: python3 -B scripts/test_musl_msync.py
      - name: Verify committed source manifest export
        run: python3 -B scripts/test_source_manifest.py
      - name: Check browser user-runtime completion and lifecycle
        run: |
          node --test sources/distro/distro/vm-test/runtime-smoke-test.js \
            sources/distro/distro/vm-test/shutdown-test.js \
            sources/distro/distro/vm-test/runner-shutdown-test.js
      - name: Check network readiness, timeout handling and remaining output collection
        run: node --test sources/distro/packages/linux-guest/tests/helpers.test.ts
      - name: Check userland memory ABI and agent browser packaging
        run: |
          node --test sources/distro/distro/busybox/check-binary.test.mjs
          node --test sources/distro/packages/browser-tests/agent-assertions.test.js
          node --test sources/distro/packages/browser-tests/erofs-app.test.js
          node --test sources/distro/packages/linux-guest/tests/agent-wasm64-userland-commands.test.ts
          node --test sources/distro/packages/linux-guest/tests/agent-wasm64-public-network.test.ts
          node --test sources/distro/packages/linux-guest/tests/run-cleanup.test.ts
          for source in process-close process-queue; do
            npx --yes esbuild@0.25.12 "sources/distro/packages/linux-guest/tests/$source.test.ts" \
              --bundle --platform=node --format=esm --target=node24 \
              --alias:@lowland/bytes=./sources/distro/packages/bytes/src/index.ts \
              --outfile="$RUNNER_TEMP/$source-test.mjs"
            node --test "$RUNNER_TEMP/$source-test.mjs"
          done
          for source in agent-app.js agent-public-app.js agent-minimal-root-app.js agent-persistent-root-app.js agent-tests/agent-check.js agent-tests/agent.spec.js agent-tests/agent-production.spec.js agent-tests/agent-public-check.js agent-tests/agent-public.spec.js agent-tests/agent-public-userland.spec.js agent-tests/agent-public-network.spec.js agent-tests/agent-minimal-root.spec.js agent-tests/agent-persistent-root.spec.js; do
            node --check "sources/distro/packages/browser-tests/$source"
          done
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/agent-wasm64-suite.ts \
            --bundle --platform=browser --format=esm --target=es2022 \
            --external:@lowland/kernel --external:@lowland/bytes \
            --outfile="$RUNNER_TEMP/agent-browser-suite.js"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/agent-wasm64-public-suite.ts \
            --bundle --platform=browser --format=esm --target=es2022 \
            --external:@lowland/kernel --external:@lowland/kernel/plugin --external:@lowland/bytes \
            --outfile="$RUNNER_TEMP/agent-public-browser-suite.js"
          node --check sources/distro/packages/browser-tests/agent-sqlite-root-app.js
          node --check sources/distro/packages/browser-tests/agent-tests/agent-sqlite-root.spec.js
          for profile in minimal persistent sqlite; do
            npx --yes esbuild@0.25.12 "sources/distro/packages/linux-guest/tests/agent-wasm64-$profile-root-suite.ts" \
              --bundle --platform=browser --format=esm --target=es2022 \
              --external:@lowland/kernel --external:@lowland/kernel/plugin --external:@lowland/bytes \
              --outfile="$RUNNER_TEMP/agent-$profile-root-suite.js"
          done
          node --test sources/distro/packages/browser-tests/agent-persistent-root.test.js
          node --test sources/distro/packages/browser-tests/agent-sqlite-root.test.js
          node --test sources/distro/packages/runner/tests/disk-storage.test.ts
      - name: Check Zstandard workload assertions with the host CLI
        # No target build here; real wasm32/wasm64 execution remains in public CI.
        run: |
          npx --yes oxfmt@0.59.0 --check sources/distro/distro/zstd/*-host.test.js
          node --test sources/distro/distro/zstd/*-host.test.js
      - name: Check standard file mmap lifetime workload on the host
        # Native mappings and padded EOF only; no target ABI or mount evidence.
        run: |
          for compiler in gcc clang; do
            "$compiler" -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/basic-init/tests/mmap-file-lifetime-host.c \
