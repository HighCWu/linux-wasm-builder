name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository:
    name: Repository metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Initialize the distro metadata source
        run: git submodule update --init --depth 1 sources/distro sources/musl
      - name: Check Wasm raw stat layouts
        run: bash scripts/check_wasm_kstat.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check SDK compiler and dependency discovery contracts
        run: |
          clang --version
          node --test sources/distro/distro/sdk/wrapper-test.js \
            sources/distro/distro/sdk/license-texts-test.js \
            sources/distro/distro/sdk/config-driver-test.js \
            sources/distro/distro/sdk/exception-codegen-test.js \
            sources/distro/distro/sdk/pkg-config-test.js
      - name: Check kernel and BusyBox source material packaging
        run: |
          node --test sources/distro/distro/linux/build-materials-test.js \
            sources/distro/distro/linux/source-bundle-test.js \
            sources/distro/distro/busybox/source-bundle.test.js
      - name: Check C++ runtime fixture with host GCC and Clang
        # Host execution catches fixture regressions; it is not Wasm ABI evidence.
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/toolchain-smoke/runtime-cxx.cc \
              -o "$RUNNER_TEMP/sdk-runtime-cxx-host"
            timeout 30s "$RUNNER_TEMP/sdk-runtime-cxx-host"
          done
      - name: Check socket runtime fixture on the build host
        # Only the Wasm init configures its own loopback interface.
        run: |
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O2 -Wall -Wextra -Werror \
              sources/distro/distro/sdk/socket-example.c \
              -o "$RUNNER_TEMP/sdk-socket-host"
            timeout 30s "$RUNNER_TEMP/sdk-socket-host"
          done
      - name: Check timer and pthread time64 fixtures on the build host
        # Shared raw-initramfs fixtures stay alive after their final marker.
        run: node --test sources/distro/distro/sdk/time-consumer-test.js
      - name: Check SQLite runtime fixture on the build host
        # Fixture validation only; actual target builds use pinned SQLite 3.51.0.
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev sqlite3 zstd
          node --test sources/distro/packages/browser-tests/site-sqlite.test.js sources/distro/packages/browser-tests/site-fs-trace.test.js sources/distro/packages/linux-guest/tests/agent-wasm64-sqlite-commands.test.ts
          node --test sources/distro/distro/sqlite3/pkg-config-test.js
          for compiler in gcc clang; do
            "$compiler" -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/sdk/sqlite-example.c -lsqlite3 \
              -o "$RUNNER_TEMP/sdk-sqlite-host"
            timeout 30s "$RUNNER_TEMP/sdk-sqlite-host"
          done
      - name: Check SDK CMake integration on the build host
        run: |
          node --test sources/distro/distro/llvm-runtimes/cxa-thread-atexit-test.js
          cmake -P sources/distro/distro/sdk/linux-wasm.cmake.in
          node --test sources/distro/distro/sdk/cmake-toolchain-test.js
          cmake -S sources/distro/distro/sdk/cmake-example \
            -B "$RUNNER_TEMP/sdk-cmake" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sdk-cmake"
          "$RUNNER_TEMP/sdk-cmake/sdk-example"
      - name: Check separately installed SDK dependency on the build host
        run: node --test sources/distro/distro/sdk/installed-consumer-test.js
      - name: Check standard Wasm exception assembly gate on the build host
        run: node --test sources/distro/distro/sdk/check-modern-eh.test.js
      - name: Check SDK Autoconf cross configuration on the build host
        run: node --test sources/distro/distro/sdk/autoconf-consumer-test.js
      - name: Check SDK Meson build-machine generator on the build host
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-meson"
          "$RUNNER_TEMP/sdk-meson/bin/pip" install --disable-pip-version-check meson==1.10.0
          meson_site=$("$RUNNER_TEMP/sdk-meson/bin/python" -c 'import pathlib, mesonbuild; print(pathlib.Path(mesonbuild.__file__).parent.parent)')
          patch -d "$meson_site" -p1 < sources/distro/distro/sdk/meson-wasm-archive-groups.patch
          "$RUNNER_TEMP/sdk-meson/bin/python" sources/distro/distro/sdk/meson-archive-test.py
          SDK_TEST_MESON="$RUNNER_TEMP/sdk-meson/bin/meson" \
            node --test sources/distro/distro/sdk/meson-consumer-test.js
      - name: Check documentation and source pins
        run: |
          python3 scripts/check_repository.py
          python3 -B scripts/test_repository_source_pins.py
      - name: Check SDK spawn bounds against the native parser
        run: python3 -B scripts/test_agent_spawn_contract.py
      - name: Check musl integer constants and format macros without building libc
        run: python3 -B scripts/test_musl_integer_headers.py
      - name: Verify committed source manifest export
        run: python3 -B scripts/test_source_manifest.py
      - name: Check browser user-runtime completion and lifecycle
        run: node --test sources/distro/distro/vm-test/runtime-smoke-test.js
      - name: Check network readiness, timeout handling and remaining output collection
        run: node --test sources/distro/packages/linux-guest/tests/helpers.test.ts
      - name: Check userland memory ABI and agent browser packaging
        run: |
          node --test sources/distro/distro/busybox/check-binary.test.mjs
          node --test sources/distro/packages/browser-tests/agent-assertions.test.js
          node --test sources/distro/packages/linux-guest/tests/agent-wasm64-userland-commands.test.ts
          node --test sources/distro/packages/linux-guest/tests/agent-wasm64-public-network.test.ts
          node --test sources/distro/packages/linux-guest/tests/run-cleanup.test.ts
          for source in process-close process-queue; do
            npx --yes esbuild@0.25.12 "sources/distro/packages/linux-guest/tests/$source.test.ts" \
              --bundle --platform=node --format=esm --target=node24 \
              --alias:@lowland/bytes=./sources/distro/packages/bytes/src/index.ts \
              --outfile="$RUNNER_TEMP/$source-test.mjs"
            node --test "$RUNNER_TEMP/$source-test.mjs"
          done
          for source in agent-app.js agent-public-app.js agent-minimal-root-app.js agent-persistent-root-app.js agent-tests/agent-check.js agent-tests/agent.spec.js agent-tests/agent-production.spec.js agent-tests/agent-public-check.js agent-tests/agent-public.spec.js agent-tests/agent-public-userland.spec.js agent-tests/agent-public-network.spec.js agent-tests/agent-minimal-root.spec.js agent-tests/agent-persistent-root.spec.js; do
            node --check "sources/distro/packages/browser-tests/$source"
          done
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/agent-wasm64-suite.ts \
            --bundle --platform=browser --format=esm --target=es2022 \
            --external:@lowland/kernel --external:@lowland/bytes \
            --outfile="$RUNNER_TEMP/agent-browser-suite.js"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/agent-wasm64-public-suite.ts \
            --bundle --platform=browser --format=esm --target=es2022 \
            --external:@lowland/kernel --external:@lowland/kernel/plugin --external:@lowland/bytes \
            --outfile="$RUNNER_TEMP/agent-public-browser-suite.js"
          node --check sources/distro/packages/browser-tests/agent-sqlite-root-app.js
          node --check sources/distro/packages/browser-tests/agent-tests/agent-sqlite-root.spec.js
          for profile in minimal persistent sqlite; do
            npx --yes esbuild@0.25.12 "sources/distro/packages/linux-guest/tests/agent-wasm64-$profile-root-suite.ts" \
              --bundle --platform=browser --format=esm --target=es2022 \
              --external:@lowland/kernel --external:@lowland/kernel/plugin --external:@lowland/bytes \
              --outfile="$RUNNER_TEMP/agent-$profile-root-suite.js"
          done
          node --test sources/distro/packages/browser-tests/agent-persistent-root.test.js
          node --test sources/distro/packages/browser-tests/agent-sqlite-root.test.js
          node --test sources/distro/packages/runner/tests/disk-storage.test.ts
      - name: Check Zstandard workload assertions with the host CLI
        # No target build here; real wasm32/wasm64 execution remains in public CI.
        run: |
          npx --yes oxfmt@0.59.0 --check sources/distro/distro/zstd/roundtrip-host.test.js
          node --test sources/distro/distro/zstd/roundtrip-host.test.js
      - name: Check standalone wasm64 embedding example without booting Linux
        run: |
          npx --yes oxfmt@0.59.0 --check \
            sources/distro/apps/wasm64-example/*.js \
            sources/distro/apps/wasm64-example/*.mjs \
            sources/distro/apps/wasm64-example/*.html \
            sources/distro/packages/browser-tests/agent-tests/wasm64-example.spec.js
          node --test sources/distro/apps/wasm64-example/server.test.js sources/distro/apps/wasm64-example/browser-support.test.js
          node --test sources/distro/apps/wasm64-example/integrity.test.js
          node --test sources/distro/apps/wasm64-example/program.test.js
          node --test sources/distro/apps/wasm64-example/download.test.js
          node --test sources/distro/apps/wasm64-example/program-fixture.test.js
          node --test sources/distro/apps/wasm64-example/app.test.js
          node --test sources/distro/distro/npm/browser-suite-packaging.test.js
          node --check sources/distro/apps/wasm64-example/app.js
          node --check sources/distro/apps/wasm64-example/server.mjs
          node --check sources/distro/packages/browser-tests/agent-tests/wasm64-example.spec.js
          npx --yes esbuild@0.25.12 sources/distro/apps/wasm64-example/app.js \
            --bundle --platform=browser --format=esm --target=es2022 \
            --alias:@lowland/guest=./sources/distro/packages/linux-guest/src/index.ts \
            --external:@lowland/kernel --external:@lowland/kernel/plugin --external:@lowland/bytes \
            --outfile="$RUNNER_TEMP/wasm64-example.js"
      - name: Check complete ephemeral port allocation and exhaustion
        run: node --test sources/distro/packages/linux-guest/tests/network-ports.test.ts
      - name: Check UDP stream failure cleanup without booting Linux
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/network-lifecycle.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/index.ts" \
            --alias:@lowland/kernel/plugin="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/plugin.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/network-lifecycle.test.mjs"
          node --test "$RUNNER_TEMP/network-lifecycle.test.mjs"
      - name: Check TCP stream teardown and graceful half-close through the NIC
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/network-tcp-lifecycle.fixture.js \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/index.ts" \
            --alias:@lowland/kernel/plugin="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/plugin.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/network-tcp-lifecycle.test.mjs"
          node --test "$RUNNER_TEMP/network-tcp-lifecycle.test.mjs"
      - name: Check network fixture short I/O and interruption handling
        run: |
          cc -Wall -Wextra -Werror sources/distro/distro/guest-tests/network-io-test.c \
            -o "$RUNNER_TEMP/network-io-test"
          "$RUNNER_TEMP/network-io-test"
          network_test_status=0
          "$RUNNER_TEMP/network-io-test" zero || network_test_status=$?
          test "$network_test_status" -eq 1
      - name: Check OPFS initialization ownership and failure cleanup
        run: node --test sources/distro/apps/site/opfs-storage.test.js sources/distro/apps/site/opfs-device.test.js
      - name: Check Fetch response lifecycle without booting Linux
        run: node --test sources/distro/packages/linux-guest/tests/host-fetch-lifecycle.test.ts
      - name: Check HTTP input buffer ownership and fragmented framing
        run: node --test sources/distro/packages/linux-guest/tests/http-buffer-ownership.test.ts sources/distro/packages/linux-guest/tests/http-properties.test.ts
      - name: Check browser filesystem without installed workspace packages
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/browser-fs-ownership.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/browser-fs.test.mjs"
          node --test "$RUNNER_TEMP/browser-fs.test.mjs"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/browser-fs-directory.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/browser-fs-directory.test.mjs"
          node --test "$RUNNER_TEMP/browser-fs-directory.test.mjs"
      - name: Check Node directory sharing without installed workspace packages
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/virtio-fs-node.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/node-fs.test.mjs"
          node --test "$RUNNER_TEMP/node-fs.test.mjs"
      - name: Check open-file metadata uses the descriptor syscall
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/file-stat.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/file-stat.test.mjs"
          node --test "$RUNNER_TEMP/file-stat.test.mjs"
      - name: Check IPv4 header integrity and fragment boundaries
        run: node --test sources/distro/packages/linux-guest/tests/network-ipv4.test.ts
      - name: Check native wasm64 agent ABI schema without a target build
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/src/abi-wasm64.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/agent-abi-wasm64.mjs"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/abi-wasm64.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/agent-abi-wasm64.test.mjs"
          AGENT_ABI_TEST_GENERATOR="$GITHUB_WORKSPACE/sources/distro/distro/guest-agent/gen-abi-check.ts" \
            AGENT_ABI_TEST_SCHEMA="$RUNNER_TEMP/agent-abi-wasm64.mjs" \
            node --test "$RUNNER_TEMP/agent-abi-wasm64.test.mjs"
      - name: Check agent session and syscall ABIs without booting Linux
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/session-handshake.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/session-handshake.test.mjs"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/syscalls-abi.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/syscalls-abi.test.mjs"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/client-abi.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/client-abi.test.mjs"
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/agent-image.test.ts \
            --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/agent-image.test.mjs"
          node --test "$RUNNER_TEMP/session-handshake.test.mjs" "$RUNNER_TEMP/syscalls-abi.test.mjs" "$RUNNER_TEMP/client-abi.test.mjs" "$RUNNER_TEMP/agent-image.test.mjs"
          node --test sources/distro/packages/linux-guest/tests/exec-file-descriptors.test.ts
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O2 -pthread -Wall -Wextra -Werror -fsyntax-only \
              -include sources/distro/distro/guest-agent/native-wasm64.h \
              sources/distro/distro/guest-agent/agent.c
            "$compiler" -std=c11 -O2 -pthread -Wall -Wextra -Werror -fsyntax-only \
              sources/distro/distro/guest-agent/runtime-init.c \
              sources/distro/distro/guest-agent/runtime-child.c
            "$compiler" -std=c11 -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/guest-agent/handshake-test.c \
              -o "$RUNNER_TEMP/agent-handshake-host"
            timeout 10s "$RUNNER_TEMP/agent-handshake-host"
            "$compiler" -std=c11 -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/guest-agent/session-cleanup-test.c \
              -o "$RUNNER_TEMP/agent-cleanup-host"
            timeout --kill-after=2 15 "$RUNNER_TEMP/agent-cleanup-host"
          done
      - name: Check browser lifecycle report gate
        run: node --test scripts/browser-storage/check-report.test.mjs sources/distro/distro/npm/browser-report-check.test.mjs
      - name: Check targeted Nix cache key consistency
        run: python3 -B scripts/test_ci_cache_contract.py
      - name: Check all kernel host tests without building Linux or LLVM
        run: |
          npx --yes --package=typescript@5.9.3 -c 'bash scripts/check_kernel_host.sh'
      - name: Check paired benchmark summaries
        run: python3 -B scripts/test_compare_mmap_benchmarks.py
