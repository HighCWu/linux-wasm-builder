name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Initialize the distro metadata source
        run: git submodule update --init --depth 1 sources/distro sources/musl
      - name: Check Wasm raw stat layouts
        run: bash scripts/check_wasm_kstat.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check SDK compiler and dependency discovery contracts
        run: |
          clang --version
          node --test sources/distro/distro/sdk/wrapper-test.js \
            sources/distro/distro/sdk/license-texts-test.js \
            sources/distro/distro/sdk/config-driver-test.js \
            sources/distro/distro/sdk/exception-codegen-test.js \
            sources/distro/distro/sdk/pkg-config-test.js
      - name: Check kernel configuration and license material packaging
        run: node --test sources/distro/distro/linux/build-materials-test.js sources/distro/distro/linux/source-bundle-test.js
      - name: Check C++ runtime fixture with host GCC and Clang
        # Host execution catches fixture regressions; it is not Wasm ABI evidence.
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/toolchain-smoke/runtime-cxx.cc \
              -o "$RUNNER_TEMP/sdk-runtime-cxx-host"
            timeout 30s "$RUNNER_TEMP/sdk-runtime-cxx-host"
          done
      - name: Check SQLite runtime fixture on the build host
        # Fixture validation only; actual target builds use pinned SQLite 3.51.0.
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev sqlite3
          node --test sources/distro/packages/browser-tests/site-sqlite.test.js
          for compiler in gcc clang; do
            "$compiler" -O2 -pthread -Wall -Wextra -Werror \
              sources/distro/distro/sdk/sqlite-example.c -lsqlite3 \
              -o "$RUNNER_TEMP/sdk-sqlite-host"
            timeout 30s "$RUNNER_TEMP/sdk-sqlite-host"
          done
      - name: Check SDK CMake integration on the build host
        run: |
          node --test sources/distro/distro/llvm-runtimes/cxa-thread-atexit-test.js
          cmake -P sources/distro/distro/sdk/linux-wasm.cmake.in
          node --test sources/distro/distro/sdk/cmake-toolchain-test.js
          cmake -S sources/distro/distro/sdk/cmake-example \
            -B "$RUNNER_TEMP/sdk-cmake" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sdk-cmake"
          "$RUNNER_TEMP/sdk-cmake/sdk-example"
      - name: Check separately installed SDK dependency on the build host
        run: node --test sources/distro/distro/sdk/installed-consumer-test.js
      - name: Check SDK Autoconf cross configuration on the build host
        run: node --test sources/distro/distro/sdk/autoconf-consumer-test.js
      - name: Check SDK Meson build-machine generator on the build host
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-meson"
          "$RUNNER_TEMP/sdk-meson/bin/pip" install --disable-pip-version-check meson==1.10.0
          meson_site=$("$RUNNER_TEMP/sdk-meson/bin/python" -c 'import pathlib, mesonbuild; print(pathlib.Path(mesonbuild.__file__).parent.parent)')
          patch -d "$meson_site" -p1 < sources/distro/distro/sdk/meson-wasm-archive-groups.patch
          "$RUNNER_TEMP/sdk-meson/bin/python" sources/distro/distro/sdk/meson-archive-test.py
          SDK_TEST_MESON="$RUNNER_TEMP/sdk-meson/bin/meson" \
            node --test sources/distro/distro/sdk/meson-consumer-test.js
      - name: Check documentation and source pins
        run: python3 scripts/check_repository.py
      - name: Verify committed source manifest export
        run: python3 -B scripts/test_source_manifest.py
      - name: Check browser user-runtime completion and lifecycle
        run: node --test sources/distro/distro/vm-test/runtime-smoke-test.js
      - name: Check network listener readiness and timeout handling
        run: node --test sources/distro/packages/linux-guest/tests/helpers.test.ts
      - name: Check network fixture short I/O and interruption handling
        run: |
          cc -Wall -Wextra -Werror sources/distro/distro/guest-tests/network-io-test.c \
            -o "$RUNNER_TEMP/network-io-test"
          "$RUNNER_TEMP/network-io-test"
          network_test_status=0
          "$RUNNER_TEMP/network-io-test" zero || network_test_status=$?
          test "$network_test_status" -eq 1
      - name: Check OPFS initialization ownership and failure cleanup
        run: node --test sources/distro/apps/site/opfs-storage.test.js
      - name: Check Fetch response lifecycle without booting Linux
        run: node --test sources/distro/packages/linux-guest/tests/host-fetch-lifecycle.test.ts
      - name: Check browser filesystem without installed workspace packages
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/browser-fs-ownership.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/browser-fs.test.mjs"
          node --test "$RUNNER_TEMP/browser-fs.test.mjs"
      - name: Check Node directory sharing without installed workspace packages
        run: |
          npx --yes esbuild@0.25.12 sources/distro/packages/linux-guest/tests/virtio-fs-node.test.ts \
            --bundle --platform=node --format=esm \
            --alias:@lowland/kernel="$GITHUB_WORKSPACE/sources/distro/packages/kernel/src/virtio/fs.ts" \
            --alias:@lowland/bytes="$GITHUB_WORKSPACE/sources/distro/packages/bytes/src/index.ts" \
            --outfile="$RUNNER_TEMP/node-fs.test.mjs"
          node --test "$RUNNER_TEMP/node-fs.test.mjs"
      - name: Check browser lifecycle report gate
        run: node --test scripts/browser-storage/check-report.test.mjs sources/distro/distro/npm/browser-report-check.test.mjs
      - name: Check targeted Nix cache key consistency
        run: python3 -B scripts/test_ci_cache_contract.py
      - name: Check all kernel host tests without building Linux or LLVM
        run: |
          npx --yes --package=typescript@5.9.3 -c 'bash scripts/check_kernel_host.sh'
      - name: Check paired benchmark summaries
        run: python3 -B scripts/test_compare_mmap_benchmarks.py
