# SPDX-License-Identifier: MIT
name: Prefetch source hash

on:
  workflow_dispatch:
    inputs:
      repository:
        description: HighCWu source repository
        required: true
        type: choice
        options:
          - musl
          - linux
          - llvm-project
      revision:
        description: Full 40-character commit SHA
        required: true
        type: string
      git-baseline-revision:
        description: Optional verified immediate parent for Linux Git-archive experiment
        required: false
        type: string
      git-baseline-hash:
        description: Optional independently verified archive SRI, required with Git baseline
        required: false
        type: string

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs['git-baseline-revision'] != '' || inputs['git-baseline-hash'] != '' }}
        with:
          persist-credentials: false
          submodules: false
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Compute unpacked source hash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REVISION: ${{ inputs.revision }}
          BASELINE_REVISION: ${{ inputs['git-baseline-revision'] }}
          BASELINE_HASH: ${{ inputs['git-baseline-hash'] }}
        run: |
          set -euo pipefail
          case "$SOURCE_REPOSITORY" in
            musl|linux|llvm-project) ;;
            *) exit 1 ;;
          esac
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n ${BASELINE_REVISION:-} || -n ${BASELINE_HASH:-} ]]; then
            [[ "$SOURCE_REPOSITORY" == linux ]]
            bash scripts/prefetch_linux_git.sh
            exit 0
          fi
          source_hash=""
          # Same immutable tree as the build fetcher; avoid spending all
          # retries at one rate-limited endpoint before trying its mirror.
          for source_url in \
            "https://codeload.github.com/HighCWu/$SOURCE_REPOSITORY/tar.gz/$SOURCE_REVISION" \
            "https://github.com/HighCWu/$SOURCE_REPOSITORY/archive/$SOURCE_REVISION.tar.gz"; do
            if nix store prefetch-file --unpack --json --option download-attempts 2 \
              "$source_url" | tee "$RUNNER_TEMP/source-hash.json"; then
              source_hash=$(jq --exit-status --raw-output \
                '.hash | select(type == "string" and test("^sha256-[A-Za-z0-9+/]{43}=$"))' \
                "$RUNNER_TEMP/source-hash.json")
              break
            fi
          done
          [[ -n "$source_hash" ]]
          {
            echo "Repository: HighCWu/$SOURCE_REPOSITORY"
            echo "Revision: $SOURCE_REVISION"
            echo "Hash: $source_hash"
          } >> "$GITHUB_STEP_SUMMARY"
