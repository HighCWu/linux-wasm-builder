# SPDX-License-Identifier: MIT
name: LLVM Wasm symbol versions experiment

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      prefetch-source-only:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      revision:
        description: Exact experimental HighCWu/llvm-project source commit
        required: true
        type: string
      prefetch-source-only:
        description: Verify and print the unpacked source hash without building LLVM
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-hash:
    name: Verify and prefetch LLVM source hash
    if: ${{ inputs['prefetch-source-only'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.prefetch.outputs.revision }}
      hash: ${{ steps.prefetch.outputs.hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 1
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Verify the pinned source and prefetch candidate hash
        id: prefetch
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          distro_revision="$(git rev-parse HEAD:sources/distro)"
          [[ "$distro_revision" =~ ^[0-9a-f]{40}$ ]]
          fixed_nix="$RUNNER_TEMP/llvm-toolchain-unwrapped.nix"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/HighCWu/distro/$distro_revision/distro/llvm-toolchain/unwrapped.nix" \
            --output "$fixed_nix"
          python3 - "$fixed_nix" "$RUNNER_TEMP/llvm-source-fields.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()
          marker = "src ? pkgs.fetchFromGitHub {"
          starts = [match.start() for match in re.finditer(re.escape(marker), source)]
          if len(starts) != 1:
              raise SystemExit("expected one fixed llvm-toolchain fetchFromGitHub source block")
          start = starts[0]
          end = source.find("\n  },", start)
          if end < 0:
              raise SystemExit("could not find the end of the fixed llvm-toolchain source block")
          block = source[start:end]

          def one(name):
              values = re.findall(
                  r"^\s*" + re.escape(name) + r'\s*=\s*"([^"\n]+)";\s*$',
                  block,
                  re.MULTILINE,
              )
              if len(values) != 1:
                  raise SystemExit(f"expected one {name} in the fixed llvm-toolchain source block")
              return values[0]

          owner, repository, revision, source_hash = (
              one("owner"),
              one("repo"),
              one("rev"),
              one("hash"),
          )
          if (owner, repository) != ("HighCWu", "llvm-project"):
              raise SystemExit("the pinned source is not HighCWu/llvm-project")
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("the pinned source revision must be a full commit hash")
          if re.fullmatch(r"sha256-[A-Za-z0-9+/]{43}=", source_hash) is None:
              raise SystemExit("the pinned source hash must be a SHA-256 SRI")
          Path(sys.argv[2]).write_text("\n".join((owner, repository, revision, source_hash)) + "\n")
          PY
          mapfile -t fixed_source < "$RUNNER_TEMP/llvm-source-fields.txt"
          [[ ${#fixed_source[@]} -eq 4 ]]
          [[ "${fixed_source[0]}" == HighCWu && "${fixed_source[1]}" == llvm-project ]]
          pinned_revision="${fixed_source[2]}"
          pinned_hash="${fixed_source[3]}"

          prefetch_unpacked_hash() {
            local revision="$1"
            local json_path="$2"
            local source_url source_hash
            for source_url in \
              "https://codeload.github.com/HighCWu/llvm-project/tar.gz/$revision" \
              "https://github.com/HighCWu/llvm-project/archive/$revision.tar.gz"; do
              if nix store prefetch-file --unpack --json --option download-attempts 2 \
                "$source_url" > "$json_path"; then
                if ! source_hash="$(jq --exit-status --raw-output \
                  '.hash | select(type == "string" and test("^sha256-[A-Za-z0-9+/]{43}=$"))' \
                  "$json_path")"; then
                  return 1
                fi
                [[ -n "$source_hash" ]]
                printf '%s\n' "$source_hash"
                return 0
              fi
            done
            return 1
          }

          baseline_hash="$(prefetch_unpacked_hash "$pinned_revision" "$RUNNER_TEMP/llvm-baseline-prefetch.json")"
          [[ "$baseline_hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]
          if [[ "$baseline_hash" != "$pinned_hash" ]]; then
            printf 'pinned LLVM source hash mismatch: expected %s, got %s\n' \
              "$pinned_hash" "$baseline_hash" >&2
            exit 1
          fi

          candidate_hash="$(prefetch_unpacked_hash "$CANDIDATE_REVISION" "$RUNNER_TEMP/llvm-candidate-prefetch.json")"
          [[ "$candidate_hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]
          {
            echo "revision=$CANDIDATE_REVISION"
            echo "hash=$candidate_hash"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Verified pinned source: HighCWu/llvm-project $pinned_revision ($pinned_hash)"
            echo "Candidate source: HighCWu/llvm-project $CANDIDATE_REVISION ($candidate_hash)"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Verified pinned source: HighCWu/llvm-project %s (%s)\n' "$pinned_revision" "$pinned_hash"
          printf 'Candidate source: HighCWu/llvm-project %s (%s)\n' "$CANDIDATE_REVISION" "$candidate_hash"

  candidate:
    if: ${{ !inputs['prefetch-source-only'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - name: Fetch the exact candidate without changing default SDK pins
        env:
          LLVM_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$LLVM_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git init "$RUNNER_TEMP/llvm-symbol-source"
          git -C "$RUNNER_TEMP/llvm-symbol-source" remote add origin https://github.com/HighCWu/llvm-project.git
          git -C "$RUNNER_TEMP/llvm-symbol-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/llvm-symbol-source" sparse-checkout set llvm clang lld cmake third-party
          git -C "$RUNNER_TEMP/llvm-symbol-source" fetch --depth=1 --filter=blob:none origin "$LLVM_REVISION"
          git -C "$RUNNER_TEMP/llvm-symbol-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llvm-symbol-source" rev-parse HEAD)" = "$LLVM_REVISION"
      - name: Build candidate Clang, MC and Wasm linker without host backends
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/llvm-symbol-source/llvm" -B "$RUNNER_TEMP/llvm-symbol-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_TARGETS_TO_BUILD=WebAssembly '-DLLVM_ENABLE_PROJECTS=clang;lld' \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_TERMINFO=OFF
          cmake --build "$RUNNER_TEMP/llvm-symbol-build" --target clang llvm-mc llvm-as obj2yaml split-file llc FileCheck lld -j2
          if [ ! -x "$RUNNER_TEMP/llvm-symbol-build/bin/wasm-ld" ]; then
            ln -s lld "$RUNNER_TEMP/llvm-symbol-build/bin/wasm-ld"
          fi
      - name: Verify strict unresolved-symbol policy for wasm32 and wasm64
        run: |
          set -euo pipefail
          bash scripts/check-llvm-no-undefined.sh \
            --clang "$RUNNER_TEMP/llvm-symbol-build/bin/clang" \
            --ld "$RUNNER_TEMP/llvm-symbol-build/bin/wasm-ld" \
            --node "$(command -v node)"
      - name: Verify ordinary dynamic-linking driver options with candidate tools
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/llvm-symbol-source/clang/test/Driver/wasm-export-dynamic.c" ] || \
             [ -f "$RUNNER_TEMP/llvm-symbol-source/lld/test/wasm/as-needed.s" ]; then
            python3 -B scripts/check_wasm_driver_linker_compat.py \
              --source-root "$RUNNER_TEMP/llvm-symbol-source" \
              --tools-dir "$RUNNER_TEMP/llvm-symbol-build/bin"
          else
            echo 'This source revision predates the dynamic-linking option regressions.'
          fi
      - name: Verify cache-clear lowering for both Wasm address widths
        run: |
          set -euo pipefail
          test_file="$RUNNER_TEMP/llvm-symbol-source/llvm/test/CodeGen/WebAssembly/clear-cache.ll"
          for bits in 32 64; do
            "$RUNNER_TEMP/llvm-symbol-build/bin/llc" \
              -mtriple="wasm$bits-unknown-unknown" -asm-verbose=false < "$test_file" | \
              "$RUNNER_TEMP/llvm-symbol-build/bin/FileCheck" "$test_file" \
                --check-prefixes="CHECK,CHK$bits"
          done
      - name: Verify old/default versions using real generated Wasm objects
        run: |
          set -euo pipefail
          python3 scripts/check_wasm_symbol_versions.py \
            --mc "$RUNNER_TEMP/llvm-symbol-build/bin/llvm-mc" \
            --ld "$RUNNER_TEMP/llvm-symbol-build/bin/wasm-ld" \
            --clang "$RUNNER_TEMP/llvm-symbol-build/bin/clang"
      - name: Verify opt-in Linux64 varargs through ordinary and LTO driver links
        run: |
          set -euo pipefail
          python3 -B scripts/check_wasm_linux64_varargs.py \
            --clang "$RUNNER_TEMP/llvm-symbol-build/bin/clang" \
            --ld "$RUNNER_TEMP/llvm-symbol-build/bin/wasm-ld"
      - name: Verify PIC dependencies and reservations with the same candidate
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 sources/distro sources/musl
          python3 -B scripts/probe_wasm_dynamic_linking.py \
            --clang "$RUNNER_TEMP/llvm-symbol-build/bin/clang"
